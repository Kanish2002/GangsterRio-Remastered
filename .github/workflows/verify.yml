name: Verify preservation host
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm test
      - run: npm run build
      - run: sudo mkdir -p /files && sudo chown "$USER" /files
      - run: node scripts/build-probe.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node e2e/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-host-results
          path: browser-results/
          retention-days: 7
